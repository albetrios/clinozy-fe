# Gitleaks configuration — gitleaks' built-in rules plus this repository's allowlist
# https://github.com/gitleaks/gitleaks
#
# `[extend] useDefault = true` loads the built-in rules: without it this file defines no rule
# and every scan passes. The PR CI secrets job plants a key before it scans and fails when this
# config misses it; tests/ci/secret-scan.policy.test.ts pins the block. A fixture value that
# looks like a secret carries an inline `gitleaks:allow`; findings in old commits, which no
# edit can mark, are listed by fingerprint in .gitleaksignore.

[extend]
useDefault = true

# Every path entry is anchored to whole path segments (H-5). Unanchored, `\.git` also matched
# `.github/` and `build` matched any path holding the word, so no workflow file was ever scanned.
# tests/ci/secret-scan.policy.test.ts plants a key under .github/workflows/ (found) and under
# node_modules/ (skipped); the PR CI canary does the same before it scans.
[allowlist]
description = "Global Allowlist"
paths = [
  '''(^|/)(node_modules|dist|build|coverage)/''',
  '''(^|/)\.git/''',
  '''(^|/)\.env\.example$''',
  '''(^|/)pnpm-lock\.yaml$''',
]
