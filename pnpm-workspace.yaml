# pnpm 11+ (this repo pins 12 via package.json `packageManager`) reads its
# settings ONLY from this file: the `pnpm` field of package.json and pnpm
# settings in .npmrc are ignored (.npmrc keeps auth/registry keys only). pnpm 12
# also fails on a key it does not recognize here, so keep spellings exact.

# Refuse to install on a Node outside package.json `engines` (was engine-strict=true in .npmrc).
engineStrict: true

# pnpm 10+ blocks dependency build scripts until each one is decided here, and
# pnpm 11+ fails the install (ERR_PNPM_IGNORED_BUILDS) on any left undecided.
# Allow only what the toolchain needs; deny the rest explicitly.
allowBuilds:
  # tsx / vitest / vite plugins -> esbuild; install.js verifies the platform binary.
  esbuild: true
  # Each ships its native binary as an optionalDependency; the script is only a
  # build-from-source / download fallback when optional deps are omitted.
  '@parcel/watcher': false
  '@sentry/cli': false
  # Postinstall only prints a funding banner.
  core-js: false
  # Postinstall writes shell completion into the user's home and prints a banner.
  netlify-cli: false
  # Optional native addon for hot-shots (netlify-cli telemetry over a unix socket); unused.
  unix-dgram: false

# Advisories accepted because NO fixed version is published — the same rule as
# clinozy-be. A fix exists → an override below (or a bump), never an entry here.
# One entry per GHSA, under a comment naming its Package:, Path:, No fix: and
# Remove when: (`pnpm deps:audit` refuses an entry without them). `pnpm audit`
# honours this list; `tooling/ci/bulk-audit.mjs` reads it too, still REPORTS each
# accepted advisory, and FAILS once the package's newest release is outside the
# vulnerable range — so an entry cannot outlive its reason. The accepted-risk
# table in docs/reference/dependency-upgrades.md lists the same ids.
# None is accepted today: node-forge (GHSA-86w9-cpqp-85rv), the last entry, left the
# tree on 2026-11-03. The next accepted advisory goes under `auditConfig:` →
# `ignoreGhsas:` as a block list, one `- GHSA-…` line under its comment.
auditConfig:
  ignoreGhsas:
    # Package: deepmerge >=4.2.0 <=4.3.1 — GHSA-gcqx-w48m-w2h4 (low, `mergeObject()` lets a
    # `__proto__` key poison the returned object).
    # Path: dev/build tools only — shadcn (CLI), workbox-build > @rollup/plugin-node-resolve
    # (build-time, merges this repository's own config) and netlify-cli > @netlify/config. Never in
    # the shipped bundle; no untrusted input reaches it.
    # No fix: 4.3.1 is the newest release and the advisory lists no patched version. The bug is
    # closed locally by patches/deepmerge@4.3.1.patch (patchedDependencies below); `pnpm audit`
    # matches by version, so the id stays listed.
    # Remove when: deepmerge publishes a fix — then override it and drop the patch.
    - GHSA-gcqx-w48m-w2h4

# Transitive pins: patched floors for advisories upstream has not picked up yet.
# Prefer bounded ranges (>=x.y.z <nextMajor) so patches flow while the known-CVE
# floor holds. A change here needs a regenerated pnpm-lock.yaml in the same commit.
overrides:
  basic-ftp: '>=5.3.1 <6'
  esbuild: '>=0.28.1'
  protobufjs: '>=7.6.4 <8'
  minimatch: '>=11.0.1 <12'
  nanoid@3: '>=3.3.18 <4'
  nanoid@5: '>=5.1.16 <6'
  multiparty: '>=4.3.0'
  tmp: '>=0.2.6'
  dompurify: '>=3.4.17 <4'
  undici@7: '^7.30.1'
  ws: '>=8.21.0'
  http-proxy-middleware: '>=3.0.7'
  '@modelcontextprotocol/sdk': '>=1.31.0 <2'
  '@opentelemetry/core': '>=2.8.0'
  '@fastify/static': '>=10.1.2 <11'
  brace-expansion: '>=5.0.12 <6'
  fast-uri: '>=3.1.9 <4'
  smol-toml: '>=1.8.0 <2'
  find-my-way: '>=9.7.0 <10'
  ip-address: '>=10.7.4 <11'
  js-yaml@5: '>=5.2.2 <6'
  postcss: '>=8.5.23 <9'
  sharp: '>=0.35.1 <0.36'
  # Across the parents' major: every netlify-cli package (27.14.2 the newest) declares toml
  # ^4, and the parse DoS fixes (GHSA-4qx8-w7c3-pj3p, GHSA-9j65-hcg3-gc64, GHSA-9qmh-m7c6-f92p)
  # ship only in 5.0.1. toml 5 keeps the one export they call, `parse`, and parses this
  # repository's netlify.toml identically to 4.3.0. Remove when netlify-cli moves to toml 5.
  toml: '>=5.0.1 <6'
  svgo: '>=4.0.2 <5'
  '@hono/node-server': '>=2.1.3 <3'
  hono: '>=4.13.11 <5'
  axios: '>=1.20.0 <2'
  markdown-it@14: '>=14.3.1 <15'
  seroval: '>=1.6.11 <2'
  source-map-js: '>=1.2.2 <2'
  body-parser@2: '>=2.4.0 <3'
  fastify: '>=5.12.6 <6'
  serialize-javascript: '>=7.1.3 <8'
  follow-redirects: '>=1.16.2 <2'
  systeminformation: '>=5.33.16 <6'
  # Across the parent's pin: markdownlint 0.42.0 (markdownlint-cli2, dev only) pins re2js
  # 2.8.6 exactly, and GHSA-gg6h-894w-4m9c is fixed in the 2.8.7 patch — confined to that
  # parent, as in clinozy-be. Remove when markdownlint moves past re2js 2.8.6.
  'markdownlint>re2js': '>=2.8.7 <2.9'
  # Across the parent's cap: micromark-extension-math (markdownlint-cli2, dev only) declares
  # katex ^0.16, and GHSA-238p-pmpm-9mq7 is fixed only in 0.18.2 — confined to that parent, as
  # in clinozy-be. Remove when micromark-extension-math allows katex 0.18.
  'micromark-extension-math>katex': '>=0.18.2 <1'
  # qs <6.16.1 — GHSA-6pq8-jhm2-2vcw (moderate, `stringify` with arrayFormat 'comma' throws on a
  # non-callable own `toString`). express 5 (via @modelcontextprotocol/sdk, dev only) resolved
  # 6.16.0; bounded to the 6.x line, as in clinozy-be.
  qs@6: '>=6.16.1 <7'
  # Across the parents' major: glob >=9.0.0 <=14.0.1 — GHSA-3g3m-2fjr-6pw4 (moderate, a walk keeps
  # traversing after its AbortSignal fires). workbox-build (via vite-plugin-pwa) declares glob ^11;
  # @fastify/static and @vercel/nft (via netlify-cli) and @sentry/bundler-plugins (via
  # @sentry/vite-plugin) declare glob 13; no 11.x/13.x fix exists, so the jump is confined to those
  # four parents, as in clinozy-be. glob 14 keeps the `glob` and `globSync` exports they call.
  # Remove when all four move to glob 14.
  'workbox-build>glob': '>=14.0.2 <15'
  '@fastify/static>glob': '>=14.0.2 <15'
  '@vercel/nft>glob': '>=14.0.2 <15'
  '@sentry/bundler-plugins>glob': '>=14.0.2 <15'

peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'

# pnpm 12 refuses versions published less than minimumReleaseAge (default 1440
# minutes = 1 day) ago, both when resolving and when verifying pnpm-lock.yaml.
# These exact versions were younger than that when they were locked. Keep each
# entry exact, and drop it once that version is older than the window.
minimumReleaseAgeExclude:
  - '@types/node@24.19.1'

# Local fixes for advisories no release fixes yet. Each entry is version-keyed: bumping the package
# without re-keying it fails the install, so a patch cannot silently outlive its version.
patchedDependencies:
  # GHSA-gcqx-w48m-w2h4 (low): mergeObject() let a `__proto__` key replace the returned object's
  # prototype when the target had none. The patch drops that key, as a plain-object target already
  # did; every other merge is unchanged. Drop it when deepmerge publishes a fix.
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
