# pnpm 11+ (this repo pins 12 via package.json `packageManager`) reads its
# settings ONLY from this file: the `pnpm` field of package.json and pnpm
# settings in .npmrc are ignored (.npmrc keeps auth/registry keys only). pnpm 12
# also fails on a key it does not recognize here, so keep spellings exact.

# Refuse to install on a Node outside package.json `engines` (was engine-strict=true in .npmrc).
engineStrict: true

# pnpm 10+ blocks dependency build scripts until each one is decided here, and
# pnpm 11+ fails the install (ERR_PNPM_IGNORED_BUILDS) on any left undecided.
# Allow only what the toolchain needs; deny the rest explicitly.
allowBuilds:
  # tsx / vitest / vite plugins -> esbuild; install.js verifies the platform binary.
  esbuild: true
  # Each ships its native binary as an optionalDependency; the script is only a
  # build-from-source / download fallback when optional deps are omitted.
  '@parcel/watcher': false
  '@sentry/cli': false
  # Postinstall only prints a funding banner.
  core-js: false
  # Postinstall writes shell completion into the user's home and prints a banner.
  netlify-cli: false
  # Optional native addon for hot-shots (netlify-cli telemetry over a unix socket); unused.
  unix-dgram: false

# Advisories accepted because NO fixed version is published — the same rule as
# clinozy-be. A fix exists → an override below (or a bump), never an entry here.
# One entry per GHSA, under a comment naming its Package:, Path:, No fix: and
# Remove when: (`pnpm deps:audit` refuses an entry without them). `pnpm audit`
# honours this list; `tooling/ci/bulk-audit.mjs` reads it too, still REPORTS each
# accepted advisory, and FAILS once the package's newest release is outside the
# vulnerable range — so an entry cannot outlive its reason. The accepted-risk
# table in docs/reference/dependency-upgrades.md lists the same ids.
auditConfig:
  ignoreGhsas:
    # Package: braces <=3.0.3 (high) — stack-exhaustion DoS through deeply nested
    #   brace patterns.
    # Path: micromatch@4 ← netlify-cli, shadcn and markdownlint-cli2 (dev/tooling
    #   only — `pnpm deps:audit:prod` is clean); they expand the repo's own globs.
    # No fix: 3.0.3 is the newest release, and micromatch 4.0.8 (its newest)
    #   declares ^3.0.3 — nothing to override or bump to.
    # Remove when: braces publishes a release above 3.0.3; then override to it.
    - GHSA-vfj7-8cjw-p6xm
    # Package: node-forge <=1.4.0 (high) — RSA PKCS#1 v1.5 signature verification
    #   accepts extra nested DigestAlgorithm elements.
    # Path: netlify-cli → @netlify/dev / @netlify/images → ipx@3 → listhen, which
    #   only CREATES the self-signed certificate for `netlify dev` (dev CLI only).
    # No fix: 1.4.0 is the newest release, and listhen 1.10.1 (its newest)
    #   declares ^1.4.0 — nothing to override or bump to.
    # Remove when: node-forge publishes a release above 1.4.0, or @netlify/images
    #   moves to ipx 4 (which drops listhen).
    - GHSA-86w9-cpqp-85rv

# Transitive pins: patched floors for advisories upstream has not picked up yet.
# Prefer bounded ranges (>=x.y.z <nextMajor) so patches flow while the known-CVE
# floor holds. A change here needs a regenerated pnpm-lock.yaml in the same commit.
overrides:
  basic-ftp: '>=5.3.1 <6'
  esbuild: '>=0.28.1'
  protobufjs: '>=7.6.4 <8'
  minimatch: '>=10.2.5 <11'
  nanoid@3: '>=3.3.18 <4'
  nanoid@5: '>=5.1.16 <6'
  multiparty: '>=4.3.0'
  tmp: '>=0.2.6'
  dompurify: '>=3.4.17 <4'
  undici@7: '^7.28.0'
  ws: '>=8.21.0'
  http-proxy-middleware: '>=3.0.7'
  '@modelcontextprotocol/sdk': '>=1.31.0 <2'
  '@opentelemetry/core': '>=2.8.0'
  '@fastify/static': '>=10.1.2 <11'
  brace-expansion: '>=5.0.12 <6'
  fast-uri: '>=3.1.8 <4'
  smol-toml: '>=1.8.0 <2'
  find-my-way: '>=9.7.0 <10'
  ip-address: '>=10.7.4 <11'
  js-yaml@5: '>=5.2.2 <6'
  postcss: '>=8.5.23 <9'
  sharp: '>=0.35.1 <0.36'
  # Across the parents' major: every netlify-cli package (27.14.2 the newest) declares toml
  # ^4, and the parse DoS fixes (GHSA-4qx8-w7c3-pj3p, GHSA-9j65-hcg3-gc64, GHSA-9qmh-m7c6-f92p)
  # ship only in 5.0.1. toml 5 keeps the one export they call, `parse`, and parses this
  # repository's netlify.toml identically to 4.3.0. Remove when netlify-cli moves to toml 5.
  toml: '>=5.0.1 <6'
  svgo: '>=4.0.2 <5'
  '@hono/node-server': '>=2.0.5 <3'
  hono: '>=4.12.34 <5'
  axios: '>=1.20.0 <2'
  markdown-it@14: '>=14.3.1 <15'
  seroval: '>=1.6.3 <2'
  source-map-js: '>=1.2.2 <2'

peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'

# pnpm 12 refuses versions published less than minimumReleaseAge (default 1440
# minutes = 1 day) ago, both when resolving and when verifying pnpm-lock.yaml.
# These exact versions were younger than that when they were locked. Keep each
# entry exact, and drop it once that version is older than the window.
minimumReleaseAgeExclude:
  - '@types/node@24.19.1'
