# Netlify config for Clinozy Frontend — deploy-time only (headers, redirects).
#
# clinozy-fe never builds ON Netlify. GitHub Actions runs `pnpm build` — the env it bakes is
# validated there, production's bytes are attested, and the one build that uploads source maps
# to Sentry is the one that ships — then uploads dist/ with `netlify deploy --no-build`. So:
#   - `ignore` exits 0, which cancels any build Netlify's Git integration starts;
#   - `command` fails, so a build started any other way (a `netlify deploy` without
#     --no-build) stops instead of shipping a second, unvalidated bundle.
# Pinned by tests/ci/netlify-no-build.policy.test.ts.

[build]
  ignore = "exit 0"
  command = "echo 'clinozy-fe does not build on Netlify: run pnpm build, then netlify deploy --no-build (docs/deployment/cicd-and-netlify.md).' >&2; exit 1"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# A MISSING content-hashed asset is a stale chunk from a superseded deploy — never
# a client route. Without this rule the SPA catch-all below rewrites it to
# index.html with a 200 and the browser reports "Expected a JavaScript-or-Wasm
# module script but the server responded with a MIME type of text/html", which
# says nothing about the real cause. A real 404 keeps the failure honest and lets
# `vite:preloadError` fire cleanly for src/core/version/stale-chunk-recovery.ts.
# Netlify serves existing files before applying redirects, so live assets never
# reach this rule.
#
# Caveat, unverified against the live CDN: header rules match the REQUEST path, so
# the `/assets/*` block below may stamp this 404 with `immutable` caching — a
# browser that cached it would stay broken for that exact URL even after a
# rollback restores the file. The same would apply to the catch-all's 200 (with a
# worse payload: index.html served as a module), so this is not a regression, and
# recovery no longer depends on the status: src/core/version/stale-chunk-recovery.ts
# reloads on `vite:preloadError` whichever way the miss is answered. Confirm on a
# deploy preview before relying on the 404 alone.
[[redirects]]
  from = "/assets/*"
  to = "/offline.html"
  status = 404

# SPA: serve index.html for non-file routes (client-side routing)
# Netlify serves existing files from publish dir first; only missing paths get this rewrite
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (parity with public/_headers)
[[headers]]
  for = "/*"
  [headers.values]
    # DENY, not SAMEORIGIN: public/_headers has said DENY all along, and the CSP
    # it ships carries `frame-ancestors 'none'`, which supersedes this header in
    # every browser that supports it. SAMEORIGIN here was the odd one out —
    # claiming same-origin framing is allowed when the CSP forbids all of it.
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
