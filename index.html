<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{PRODUCT_NAME}} — {{PRODUCT_DESCRIPTION}}" />
    <!-- No PostHog preconnect: analytics runs only after consent, so the page must not contact
         it before then (D161). -->
    <!-- Turnstile loads on the login critical path (captcha script + iframe);
         preconnecting shaves the TLS/handshake off LCP. -->
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin />
    <link rel="dns-prefetch" href="https://challenges.cloudflare.com" />
    <link rel="dns-prefetch" href="https://o0.ingest.sentry.io" />
    <meta name="theme-color" content="{{PRODUCT_THEME_COLOR}}" />
    <!-- frame-ancestors is intentionally absent here: browsers ignore it in
         meta CSPs (header-only directive). It ships as a real header from
         public/_headers, alongside X-Frame-Options: DENY. -->
    <!-- CSP upgrade-insecure is header-only (dist/_headers). Omitting it from meta
         avoids Safari/WebKit upgrading http://localhost assets to HTTPS during
         local preview. See buildContentSecurityPolicy() in csp-api-origin.ts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
             script-src 'self' https://challenges.cloudflare.com https://js.stripe.com https://us-assets.i.posthog.com;
             style-src 'self' 'unsafe-inline';
             connect-src 'self'<!-- CSP_API_CONNECT_SRC -->
               https://*.ingest.sentry.io
               https://*.sentry.io
               https://us.i.posthog.com
               https://us-assets.i.posthog.com
               https://api.pwnedpasswords.com
               https://api.stripe.com
               https://m.stripe.com
               https://m.stripe.network
               https://*.amazonaws.com;
             img-src 'self' data: blob: https://*.amazonaws.com;
             font-src 'self';
             worker-src 'self' blob:;
             frame-src https://challenges.cloudflare.com https://js.stripe.com https://hooks.stripe.com;
             object-src 'none';
             base-uri 'self';
             form-action 'self';"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>{{PRODUCT_NAME}}</title>
    <!-- Runtime config from Docker entrypoint (noop in dev) -->
    <script src="/config.js" defer></script>
    <!-- Prevent theme FOUC: apply the look and the saved mode before React hydrates -->
    <script src="/theme-init.js"></script>
    <!-- Prevent locale/dir FOUC: apply lang + dir from locale-preference before paint -->
    <script src="/locale-init.js"></script>
    <!-- Skip the boot splash on the load right after a sign-out: the page being left
         stays until the login screen paints (APP_SPLASH_SKIP, app-splash.ts) -->
    <script src="/splash-init.js"></script>
    <!-- Boot splash (KICKOFF §6.1; splash.md). Frames 1–4 — the mark, its halo,
         the "C", the dot and the wordmark — are CSS keyframes here, so they play
         before any JS. theme-init.js sets `.dark` and the look first, so every
         colour is the theme's from the first frame. The
         React slot (AppSplashSlot) fills `.app-splash-slot` with the greeting
         block; the HTML carries no copy (Q-S1). src/lib/app-splash.ts decides the
         exit. `position: fixed` can't introduce a scrollbar. -->
    <style>
      /* Pre-paint fallbacks for the tokens the splash paints from: the app's
         one look (clinozy-zinc-pastel in src/index.css). `:where()` keeps them
         at zero specificity — the stylesheet's own `:root`, `.dark` and look
         blocks win as soon as it has loaded. theme-init.js writes no inline
         token, so nothing outranks them. Keep in step with the look's blocks. */
      :where(html) {
        --color-background: oklch(1 0 0);
        --color-card: oklch(1 0 0);
        --color-foreground: oklch(0.141 0.004 285.8);
        --color-primary: oklch(0.21 0.006 285.9);
        --color-primary-foreground: oklch(0.985 0 0);
        --color-brand-mark: oklch(0.72 0.14 150);
        --color-brand-mark-strong: oklch(0.6 0.14 150);
        --radius-lg: 0.5rem;
        background: var(--color-background);
      }
      :where(html.dark) {
        --color-background: oklch(0.193 0.006 285.8);
        --color-card: oklch(0.193 0.006 285.8);
        --color-foreground: oklch(0.985 0 0);
        --color-primary: oklch(0.967 0.001 286.4);
        --color-primary-foreground: oklch(0.165 0.004 285.9);
      }
      /* The layer: full bleed on `card`, one column centred on both axes. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        overflow: hidden;
        background: var(--color-card);
        /* Frame 7: out over 500ms ease, pointer events off at once. Keep in step
           with EXIT_FALLBACK_MS in src/lib/app-splash.ts. */
        transition:
          opacity 500ms ease,
          visibility 500ms ease;
      }
      #app-splash.app-splash-exiting {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      /* The app renders underneath at opacity 0 and comes in over 450ms as the
         splash leaves. */
      #root {
        transition: opacity 450ms ease;
      }
      #app-splash:not(.app-splash-exiting) ~ #root {
        opacity: 0;
      }
      /* The load right after a sign-out (splash-init.js): no splash, and the app at
         once — nothing paints until the login screen does, so the browser keeps the
         page being left on screen until then. */
      .app-splash-skip #app-splash {
        visibility: hidden;
        pointer-events: none;
      }
      .app-splash-skip #app-splash ~ #root {
        opacity: 1;
        transition: none;
      }
      .app-splash-emblem {
        position: relative;
        flex: none;
        display: block;
        width: 64px;
        height: 64px;
      }
      /* Frame 2: the halo — inset −10px, `rounded-3xl`, brand-mark at 18% —
         breathes once behind the mark. */
      .app-splash-halo {
        position: absolute;
        inset: -10px;
        border-radius: calc(var(--radius-lg) * 3);
        background: color-mix(in oklab, var(--color-brand-mark) 18%, transparent);
        opacity: 0;
        animation: app-splash-halo 1400ms cubic-bezier(0.2, 0.8, 0.2, 1) 550ms both;
      }
      /* Frame 1: the product mark (L-59) — the same drawing as ProductMark and
         public/app-icon.svg; a brand asset, so its corner is fixed. */
      .app-splash-mark {
        position: relative;
        display: block;
        width: 64px;
        height: 64px;
        transform-origin: 50% 50%;
        animation: app-splash-mark 700ms cubic-bezier(0.2, 0.9, 0.25, 1.05) 50ms both;
      }
      .app-splash-tile {
        fill: var(--color-primary);
      }
      /* Frame 2: the "C" draws. */
      .app-splash-c {
        stroke: var(--color-primary-foreground);
        stroke-dasharray: 40;
        stroke-dashoffset: 40;
        animation: app-splash-c 700ms cubic-bezier(0.65, 0, 0.35, 1) 550ms forwards;
      }
      /* Frame 3: the dot pops in from its own centre. */
      .app-splash-dot {
        fill: var(--color-brand-mark);
        transform-origin: 20.2px 14px;
        transform: scale(0);
        animation: app-splash-dot 500ms cubic-bezier(0.34, 1.4, 0.64, 1) 1150ms forwards;
      }
      /* Frame 4: the wordmark rises out of a blur. The brand face, not the
         theme's body font, so it never changes face mid-boot. */
      .app-splash-word {
        display: inline-flex;
        align-items: baseline;
        font:
          600 34px/1 'Inter',
          ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: -0.03em;
        color: var(--color-foreground);
        white-space: nowrap;
        animation: app-splash-word 800ms cubic-bezier(0.16, 1, 0.3, 1) 1250ms both;
      }
      .app-splash-ring {
        display: inline-block;
        width: 0.56em;
        height: 0.56em;
        margin: 0 0.03em;
        vertical-align: -0.02em;
        overflow: visible;
      }
      .app-splash-ring-line {
        stroke: var(--color-foreground);
      }
      .app-splash-ring-dot {
        fill: var(--color-brand-mark-strong);
      }
      /* The greeting block's room, held from the first frame so the mark and
         wordmark never move when the React slot fills it (at 390 × 844 the
         mark's top sits at y≈322). Every boot keeps this geometry; only the
         first load of the org layout fills it (Q-S1). */
      .app-splash-slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 57px;
        margin-top: 2px;
      }
      /* Frame 5: the greeting block rises at 1,900ms. The slot shifts the beat
         (`--app-splash-block-delay`) when the session lands later, so the block
         then rises the moment it is ready. */
      .app-splash-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        animation: app-splash-up 500ms ease var(--app-splash-block-delay, 1900ms) both;
      }
      .app-splash-progress {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .app-splash-track {
        display: block;
        width: 180px;
        height: 2px;
        border-radius: 9999px;
        overflow: hidden;
      }
      /* Frame 6: 150ms after the block (2,050ms on the beat) the bar fills from
         the inline start while the ticker steps through its three lines. */
      .app-splash-bar {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 9999px;
        transform-origin: left;
        animation: app-splash-bar 1500ms cubic-bezier(0.4, 0, 0.2, 1)
          calc(var(--app-splash-block-delay, 1900ms) + 150ms) both;
      }
      [dir='rtl'] .app-splash-bar {
        transform-origin: right;
      }
      .app-splash-ticker {
        display: block;
        height: 18px;
        overflow: hidden;
      }
      .app-splash-reel {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: app-splash-tick 1500ms cubic-bezier(0.65, 0, 0.35, 1)
          calc(var(--app-splash-block-delay, 1900ms) + 150ms) both;
      }
      .app-splash-step {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 18px;
        white-space: nowrap;
      }
      .app-splash-step-dot {
        flex: none;
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .app-splash-notice {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      @keyframes app-splash-mark {
        from {
          opacity: 0;
          transform: scale(0.6);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes app-splash-halo {
        0% {
          opacity: 0;
          transform: scale(0.7);
        }
        40% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: scale(1.25);
        }
      }
      @keyframes app-splash-c {
        from {
          stroke-dashoffset: 40;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes app-splash-dot {
        0% {
          transform: scale(0);
        }
        60% {
          transform: scale(1.25);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes app-splash-word {
        from {
          opacity: 0;
          transform: translateY(8px);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
      @keyframes app-splash-up {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes app-splash-bar {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @keyframes app-splash-tick {
        0%,
        30% {
          transform: translateY(0);
        }
        40%,
        66% {
          transform: translateY(-18px);
        }
        76%,
        100% {
          transform: translateY(-36px);
        }
      }
      /* Reduced motion: every frame lands at once — mark, wordmark, greeting, a
         full bar and "All set" — and the exit is a cut. */
      @media (prefers-reduced-motion: reduce) {
        #app-splash,
        #app-splash *,
        #root {
          animation-duration: 1ms !important;
          animation-delay: 0s !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
          transition-delay: 0s !important;
        }
        /* The block can land when the exit is already due: draw its end state
           outright rather than race even a 1ms animation to the next frame. */
        .app-splash-block,
        .app-splash-bar,
        .app-splash-reel {
          animation: none !important;
        }
        .app-splash-reel {
          transform: translateY(-36px);
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <p style="padding: 2rem; text-align: center">
        JavaScript is required to run this application.
      </p>
    </noscript>
    <!-- Boot splash sits OUTSIDE #root so React mount doesn't hard-cut it.
         `role="status"` carries the English label until the React slot swaps in
         the translated one; everything drawn inside is decorative. -->
    <div id="app-splash" role="status" aria-label="Loading {{PRODUCT_NAME}}">
      <span data-testid="app-splash-mark" class="app-splash-emblem" aria-hidden="true">
        <span class="app-splash-halo"></span>
        <svg
          class="app-splash-mark"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 28 28"
        >
          <rect width="28" height="28" rx="8" class="app-splash-tile" />
          <path
            d="M18.6 9.1a6.4 6.4 0 1 0 0 9.8"
            fill="none"
            stroke-width="2.6"
            stroke-linecap="round"
            class="app-splash-c"
          />
          <circle cx="20.2" cy="14" r="2.3" class="app-splash-dot" />
        </svg>
      </span>
      <span
        data-testid="app-splash-wordmark"
        class="app-splash-word"
        aria-hidden="true"
        dir="ltr"
        >{{PRODUCT_WORDMARK}}</span
      >
      <div class="app-splash-slot"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
