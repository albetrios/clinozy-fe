<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{PRODUCT_NAME}} — {{PRODUCT_DESCRIPTION}}" />
    <link rel="preconnect" href="https://us.i.posthog.com" crossorigin />
    <link rel="dns-prefetch" href="https://us.i.posthog.com" />
    <!-- Turnstile loads on the login critical path (captcha script + iframe);
         preconnecting shaves the TLS/handshake off LCP. -->
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin />
    <link rel="dns-prefetch" href="https://challenges.cloudflare.com" />
    <link rel="dns-prefetch" href="https://o0.ingest.sentry.io" />
    <meta name="theme-color" content="{{PRODUCT_THEME_COLOR}}" />
    <!-- frame-ancestors is intentionally absent here: browsers ignore it in
         meta CSPs (header-only directive). It ships as a real header from
         public/_headers, alongside X-Frame-Options: DENY. -->
    <!-- CSP upgrade-insecure is header-only (dist/_headers). Omitting it from meta
         avoids Safari/WebKit upgrading http://localhost assets to HTTPS during
         local preview. See buildContentSecurityPolicy() in csp-api-origin.ts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
             script-src 'self' https://challenges.cloudflare.com https://js.stripe.com https://us-assets.i.posthog.com;
             style-src 'self' 'unsafe-inline';
             connect-src 'self'<!-- CSP_API_CONNECT_SRC -->
               https://*.ingest.sentry.io
               https://*.sentry.io
               https://us.i.posthog.com
               https://us-assets.i.posthog.com
               https://api.pwnedpasswords.com
               https://api.stripe.com
               https://m.stripe.com
               https://m.stripe.network;
             img-src 'self' data: blob:;
             font-src 'self';
             worker-src 'self' blob:;
             frame-src https://challenges.cloudflare.com https://js.stripe.com https://hooks.stripe.com;
             object-src 'none';
             base-uri 'self';
             form-action 'self';"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>{{PRODUCT_NAME}}</title>
    <!-- Runtime config from Docker entrypoint (noop in dev) -->
    <script src="/config.js" defer></script>
    <!-- Prevent theme FOUC: apply dark class + saved accent/radius before React hydrates -->
    <script src="/theme-init.js"></script>
    <!-- Prevent locale/dir FOUC: apply lang + dir from locale-preference before paint -->
    <script src="/locale-init.js"></script>
    <!-- Branded boot loader: mirrors the React FullPageSpinner so the HTML→React
         handoff is ONE continuous screen. theme-init.js sets `.dark` first, so the
         bg + colours are theme-correct (no white flash). A breathing pulse (not a
         rotation) means the swap to React shows no visible animation restart.
         `position: fixed` can't introduce a scrollbar. Replaced when React mounts. -->
    <style>
      html {
        --color-background: oklch(1 0 0);
        --color-foreground: oklch(0.145 0 0);
        --color-primary: oklch(0.205 0 0);
        --color-primary-foreground: oklch(0.985 0 0);
        --color-muted: oklch(0.97 0 0);
        --radius-lg: 0.5rem;
        background: var(--color-background);
      }
      html.dark {
        --color-background: oklch(0.145 0 0);
        --color-foreground: oklch(0.985 0 0);
        --color-primary: oklch(0.922 0 0);
        --color-primary-foreground: oklch(0.205 0 0);
        --color-muted: oklch(0.269 0 0);
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        overflow: hidden;
        background: var(--color-background);
        /* Keep in step with EXIT_FALLBACK_MS in src/lib/app-splash.ts. An
           ease-OUT: the reveal starts fast, so the page underneath reads as
           "there" within the first frames rather than half way through. */
        transition:
          opacity 200ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 200ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #app-splash.app-splash-exiting {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      /* The product mark (L-59) — the same drawing as ProductMark and
         public/app-icon.svg: a brand asset, so its corner is fixed. */
      .app-splash-mark {
        display: flex;
        width: 3rem;
        height: 3rem;
        animation: app-splash-breathe 2.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .app-splash-mark svg {
        width: 100%;
        height: 100%;
      }
      .app-splash-tile {
        fill: var(--color-primary);
      }
      .app-splash-c {
        stroke: var(--color-primary-foreground);
      }
      .app-splash-dot {
        fill: oklch(0.72 0.14 150);
      }
      .app-splash-name {
        font:
          600 1rem/1.2 'Inter',
          ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: -0.01em;
        color: var(--color-foreground);
      }
      .app-splash-track {
        width: 8rem;
        height: 0.25rem;
        border-radius: 9999px;
        background: var(--color-muted);
        overflow: hidden;
      }
      .app-splash-bar {
        width: 50%;
        height: 100%;
        border-radius: 9999px;
        background: var(--color-primary);
        animation: app-splash-progress 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes app-splash-breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.94);
          opacity: 0.88;
        }
      }
      @keyframes app-splash-progress {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(350%);
        }
      }
      /* Shape language: Sharp (set pre-paint by theme-init.js). Mirrors what
         index.css does to the React BrandLoader's `icon-chip` and `pill` slots,
         so the HTML → React handoff does not change shape mid-boot. */
      html[data-shape='sharp'] .app-splash-track,
      html[data-shape='sharp'] .app-splash-bar {
        border-radius: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash-mark,
        .app-splash-bar {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <p style="padding: 2rem; text-align: center">
        JavaScript is required to run this application.
      </p>
    </noscript>
    <!-- Boot splash sits OUTSIDE #root so React mount doesn't hard-cut it.
         main.tsx fades it out after the first paint (ease-out crossfade). -->
    <div id="app-splash" role="status" aria-label="Loading">
      <div class="app-splash-brand">
        <div class="app-splash-mark" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
            <rect width="28" height="28" rx="8" class="app-splash-tile" />
            <path
              d="M18.6 9.1a6.4 6.4 0 1 0 0 9.8"
              fill="none"
              stroke-width="2.6"
              stroke-linecap="round"
              class="app-splash-c"
            />
            <circle cx="20.2" cy="14" r="2.3" class="app-splash-dot" />
          </svg>
        </div>
        <span class="app-splash-name">{{PRODUCT_NAME}}</span>
      </div>
      <div class="app-splash-track"><div class="app-splash-bar"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
