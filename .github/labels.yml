# Every GitHub label for this repository: name + color (pastel) + description —
# including the labels workflows create and GitHub's built-in ones, so nothing is
# left at GitHub's default gray once these are applied to the repository.
# Path-based attachment to PRs is handled by .github/labeler.yml; create/update
# these labels on GitHub when label names, colors, or descriptions change.
#
# When adding a new area:
#   1. Add an `area:<new>` entry under "Areas" below (keep alphabetised).
#   2. Add the same key in .github/labeler.yml with its glob.
#
# Colors are 6-digit hex without `#` (GitHub label format). The sections up to PR
# size use Material's 100 tones; tracked issues and GitHub's defaults use the 200
# tone of their hue, so they stay pastel but read as their own group.

# ---------- Areas (pastel rainbow — one hue per area) ----------

- name: 'area:auth'
  color: 'F8BBD0'
  description: 'Auth screens + auth runtime (token, refresh, idle-timeout, mocks)'

- name: 'area:onboarding'
  color: 'FFE0B2'
  description: 'Post-signup onboarding flow (src/pages/onboarding)'

- name: 'area:organization'
  color: 'BBDEFB'
  description: 'Organization islands, tenancy runtime, org-domain API'

- name: 'area:settings'
  color: 'E1BEE7'
  description: 'Hash-driven SettingsModal (#settings/<scope>/<section>)'

# ---------- Layers ----------

- name: 'app-shell'
  color: 'D7CCC8'
  description: 'Route tree, guards, providers, analytics/observability bootstrap (src/app)'

- name: 'core'
  color: 'C5CAE9'
  description: 'Framework-agnostic platform: HTTP, RBAC, config, data-provider (src/core)'

- name: 'shared'
  color: 'CFD8DC'
  description: 'Cross-page components, forms, hooks, layouts, store (src/shared)'

- name: 'ui-primitives'
  color: 'B2EBF2'
  description: 'Vendored shadcn/ui primitives (src/shared/components/ui)'

# ---------- Concerns ----------

- name: 'ci'
  color: 'F0F4C3'
  description: 'GitHub Actions workflows, composite actions, rulesets'

- name: 'tests'
  color: 'B2DFDB'
  description: 'Vitest colocated suites, Playwright e2e, test utils'

- name: 'docs'
  color: 'FFECB3'
  description: 'Hand-written docs under docs/ and top-level *.md'

- name: 'dependencies'
  color: 'D1C4E9'
  description: 'package.json / pnpm lockfile updates (also set by Dependabot)'

- name: 'tooling'
  color: 'DCEDC8'
  description: 'Dev/CI scripts, Vite build plugins, quality-gate configs'

- name: 'agent-os'
  color: 'FFF9C4'
  description: 'Agent skills, rules, hooks, MCP config (agent-os/)'

# ---------- PR size (set by .github/workflows/pr-governance.yml) ----------

- name: 'size/small'
  color: 'C8E6C9'
  description: '≤ 50 added+deleted lines'

- name: 'size/medium'
  color: 'FFF9C4'
  description: '51–200 added+deleted lines'

- name: 'size/large'
  color: 'FFE0B2'
  description: '201–500 added+deleted lines'

- name: 'size/x-large'
  color: 'FFCDD2'
  description: '> 500 added+deleted lines — consider splitting'

# ---------- Tracked issues (opened and updated by workflows) ----------

- name: 'ci-failure'
  color: 'FFAB91'
  description: 'Post-merge CI failed on main (tracked issue from post-merge-ci.yml)'

- name: 'sync-drift'
  color: 'FFE082'
  description: 'Weekly docs↔code drift found (tracked issue from sync-drift-canary.yml)'

# ---------- GitHub defaults (the default hue, as a pastel 200 tone) ----------

- name: 'bug'
  color: 'EF9A9A'
  description: "Something isn't working"

- name: 'documentation'
  color: '90CAF9'
  description: 'Improvements or additions to documentation'

- name: 'duplicate'
  color: '9FA8DA'
  description: 'This issue or pull request already exists'

- name: 'enhancement'
  color: '80DEEA'
  description: 'New feature or request'

- name: 'good first issue'
  color: 'B39DDB'
  description: 'Good for newcomers'

- name: 'help wanted'
  color: '80CBC4'
  description: 'Extra attention is needed'

- name: 'invalid'
  color: 'E6EE9C'
  description: "This doesn't seem right"

- name: 'question'
  color: 'CE93D8'
  description: 'Further information is requested'

- name: 'wontfix'
  color: 'BCAAA4'
  description: 'This will not be worked on'
