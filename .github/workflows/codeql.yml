name: CodeQL

# Semantic (taint-tracking) security analysis for JS/TS. Complements the Semgrep
# SAST lane in pr-ci.yml: CodeQL traces dataflow from input sources to dangerous
# sinks (DOM XSS, open redirects, postMessage) that pattern-based SAST can miss.
# Results land in the repository Security tab.
#
# Single-trunk model: analyze once per change on the PR (the authoritative gate),
# plus a weekly full scan and an on-demand dispatch. The former `push` trigger
# re-analyzed the merge commit — redundant with the PR run under PR-only merges —
# so it is dropped (same rationale as clinozy-be).

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan (Monday 04:27 UTC) so advisories that land between merges
    # are still surfaced (direct-push backstop under PR-only merges).
    - cron: '27 4 * * 1'
  # On-demand full scan of the default branch. Lets a maintainer refresh the
  # Security-tab baseline immediately after an analysis-scope change (e.g. a
  # paths-ignore edit) instead of waiting for the weekly cron — the PR trigger
  # analyzes the PR merge ref, not main, so it never updates main's alert set.
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ${{ vars.FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 || 'true' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required to upload analysis results to the Security tab.
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          languages: javascript-typescript
          # JS/TS needs no compilation; analyze source directly.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          category: '/language:javascript-typescript'

  resolve-success:
    name: Close ci-failure issue
    needs: [analyze]
    if: always() && github.event_name != 'pull_request' && needs.analyze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the open ci-failure issue
        uses: albetrios/clinozy-be/.github/actions/ci-failure-issue@91b4724304d623dd70fcabe2992cb9393457f223 # clinozy-be chore/agent-ci-hardening — repin to its main once merged
        with:
          mode: close
          title: CodeQL analysis failing

  notify-failure:
    name: Notify failure
    needs: [analyze]
    if: always() && github.event_name != 'pull_request' && (needs.analyze.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update ci-failure issue
        # A red scheduled run is invisible unless someone opens the Actions tab; one issue per
        # check sends a real notification, collects repeats as comments, and closes on the next
        # green run (clinozy-be's shared ci-failure-issue action).
        uses: albetrios/clinozy-be/.github/actions/ci-failure-issue@91b4724304d623dd70fcabe2992cb9393457f223 # clinozy-be chore/agent-ci-hardening — repin to its main once merged
        with:
          mode: open
          title: CodeQL analysis failing
          body: |
            The scheduled (or manually run) CodeQL analysis of main failed. Read the Analyze job log; a new
            finding shows under Security → Code scanning. PR runs never open this issue (the PR shows its own
            result). The next green run closes it.
