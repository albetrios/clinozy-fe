name: Mutation Test (Stryker)

# Weekly mutation-score check over the pure runtime logic (rbac, auth, tenancy,
# route helpers — the `mutate` list in stryker.config.json), killed by those
# modules' own tests (the `testFiles` list). Scheduled and non-blocking: a failing
# run is a signal that tests assert too little, not a merge gate. Thresholds
# (break: 70) live in stryker.config.json; the config itself is pinned on the PR
# gate by tests/ci/mutation-config.policy.test.ts.

on:
  schedule:
    - cron: '0 5 * * 1' # Every Monday 05:00 UTC (heaviest job; own slot before the guards)
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ${{ vars.FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 || 'true' }}

jobs:
  mutation:
    name: Stryker Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-node-pnpm

      # Stryker is installed ad-hoc (too heavy for a regular devDependency) and
      # pinned, so a Stryker release cannot change the lane between two Mondays —
      # bump core and the Vitest runner together (tests/ci/mutation-config.policy.test.ts).
      # Configuration lives in stryker.config.json; the runner is wrapped by
      # tooling/stryker/vitest-runner-shim.mjs until a release fixes it for Vitest 5.
      - run: pnpm add -D @stryker-mutator/core@10.0.0 @stryker-mutator/vitest-runner@10.0.0

      - run: pnpm exec stryker run

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 30
