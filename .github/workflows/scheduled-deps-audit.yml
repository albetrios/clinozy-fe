name: Scheduled deps audit

# Weekly `pnpm deps:audit` (tooling/ci/bulk-audit.mjs) over the full dependency
# tree. The PR `security-audit` lane now runs only when a dependency manifest
# changes (pr-ci.yml `deps` filter) — this cron restores advisory-drift coverage:
# a CVE published against an already-installed, unchanged dependency is caught
# here even when no PR touches package.json / pnpm-lock.yaml. Both steps block:
# an advisory with no published fix is accepted only through
# `auditConfig.ignoreGhsas` in pnpm-workspace.yaml (reported, not failed), and
# once a fix is published for one the run goes red until the entry is removed
# and the package overridden or bumped. Scheduled, so a finding surfaces as a
# red run on the Actions tab (there is no merge to block); trigger on demand
# with workflow_dispatch. Same two steps as the PR lane (all + prod deps).

on:
  schedule:
    - cron: '30 7 * * 1' # weekly Mon 07:30 UTC — after the sync-drift canary (07:00)
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ${{ vars.FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 || 'true' }}

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Dependency audit (all deps)
        run: pnpm deps:audit
      - name: Production dependency audit
        run: pnpm deps:audit:prod

  resolve-success:
    name: Close ci-failure issue
    needs: [audit]
    if: always() && needs.audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the open ci-failure issue
        uses: albetrios/clinozy-be/.github/actions/ci-failure-issue@b9bb2b71a8eb9175c47c3d62bf49aee3bb663bf3 # clinozy-be main (albetrios/clinozy-be#98)
        with:
          mode: close
          title: Weekly dependency audit failing

  notify-failure:
    name: Notify failure
    needs: [audit]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the fix plan reads the failed jobs and their logs
      contents: read
      issues: write
    steps:
      - name: Open or update ci-failure issue
        # A red scheduled run is invisible unless someone opens the Actions tab; one issue per
        # check sends a real notification, collects repeats as comments, and closes on the next
        # green run (clinozy-be's shared ci-failure-issue action).
        uses: albetrios/clinozy-be/.github/actions/ci-failure-issue@b9bb2b71a8eb9175c47c3d62bf49aee3bb663bf3 # clinozy-be main (albetrios/clinozy-be#98)
        with:
          mode: open
          title: Weekly dependency audit failing
          body: |
            `pnpm deps:audit` (all or production dependencies) failed: a new advisory against an installed
            package, or an `auditConfig.ignoreGhsas` entry whose fix is now published. Reproduce locally with
            pnpm deps:audit. The next green run closes this issue.
