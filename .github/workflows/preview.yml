name: Preview build

# Per-PR Netlify preview, step 1 of 2: build. Runs the PR's own code — install, client-env check,
# build — with NO secret and NO environment (H-1), then uploads dist/ as the `preview-dist`
# artifact. Step 2, preview-deploy.yml, runs from main's copy of its file (workflow_run), runs no
# code from the PR, and publishes that artifact to the PR-scoped alias pr-<number> (never --prod),
# then upserts the sticky PR comment. Advisory — NOT a required check (the ruleset requires only
# `Quality gate` + `Checks`).
#
# Why the split: this job used to hold the development environment — an account-wide Netlify
# token for the site production also serves, and the release PAT — while it ran the PR's
# install, build and netlify binary. Any same-repository PR (or a dependency it pulled in) could
# deploy over production or print the token.
#
# The client env: the build reads what it bakes from GitHub VARIABLES only — values a browser
# sees anyway. A synced deploy Variable (VITE_CAPTCHA_DISABLED, the organization mode, …) is read
# under its own name, which a job with no environment resolves at REPOSITORY level; a value the
# development environment keeps as a Secret (the API base URL, the Turnstile and Stripe
# publishable keys, …) comes from the repository variable PREVIEW_<KEY>. Without
# PREVIEW_VITE_API_BASE_URL the build is skipped with a notice (.github/environments/README.md).
# The key list mirrors reusable-netlify-deploy.yml minus the Sentry keys (previews never report
# to Sentry); tests/ci/deploy-env-sync.policy.test.ts holds them in sync.
#
# A closed PR runs the `closed` job only, so preview-deploy.yml sees a finished run and tears the
# preview down. Path-filtered so a docs-only PR does not spend a build.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.env.example'

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ${{ vars.FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 || 'true' }}

jobs:
  build:
    name: Build preview
    # Fork and Dependabot PRs get no preview (preview-deploy.yml publishes neither): no build.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # vars.* is readable in a step `if:`, but one flag keeps the gates below alike.
      HAS_PREVIEW_CONFIG: ${{ vars.PREVIEW_VITE_API_BASE_URL != '' }}
      # The hosted-deploy marker (clinozy-be's A-4): a preview is a hosted deploy, so
      # validate:client-env refuses every test-only switch for this build.
      HOSTED_DEPLOYMENT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Preview unavailable (no preview config)
        if: env.HAS_PREVIEW_CONFIG != 'true'
        run: echo "::notice title=Preview skipped::The repository variable PREVIEW_VITE_API_BASE_URL is not set (.github/environments/README.md). pr-ci build-verify still covers the build."

      - uses: ./.github/actions/setup-node-pnpm
        if: env.HAS_PREVIEW_CONFIG == 'true'

      - name: Validate client env (development profile)
        if: env.HAS_PREVIEW_CONFIG == 'true'
        env:
          DEPLOY_ENV: development
          VITE_APP_ENV: development
          VITE_API_BASE_URL: ${{ vars.PREVIEW_VITE_API_BASE_URL }}
          VITE_CAPTCHA_DISABLED: ${{ vars.VITE_CAPTCHA_DISABLED }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.PREVIEW_VITE_TURNSTILE_SITE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.PREVIEW_VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_DEBUG_LOGGING: ${{ vars.VITE_DEBUG_LOGGING }}
          VITE_DEVTOOLS: ${{ vars.VITE_DEVTOOLS }}
          VITE_E2E_HOOKS: ${{ vars.VITE_E2E_HOOKS }}
          VITE_VERSION_CHECK: ${{ vars.VITE_VERSION_CHECK }}
          VITE_PERSONAL_ORGANIZATIONS: ${{ vars.VITE_PERSONAL_ORGANIZATIONS }}
          VITE_TEAM_ORGANIZATIONS: ${{ vars.VITE_TEAM_ORGANIZATIONS }}
          VITE_DISABLED_MODULES: ${{ vars.VITE_DISABLED_MODULES }}
          STORED_FILES_ORIGIN: ${{ vars.STORED_FILES_ORIGIN }}
          CSP_REPORT_URI: ${{ vars.PREVIEW_CSP_REPORT_URI }}
        run: pnpm validate:client-env --env "$DEPLOY_ENV"

      - name: Resolve app version from release-please manifest
        if: env.HAS_PREVIEW_CONFIG == 'true'
        id: version
        run: |
          set -euo pipefail
          version="$(jq -r '."."' ".github/release-please/manifest.json")"
          echo "vite_app_version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build (development client env)
        if: env.HAS_PREVIEW_CONFIG == 'true'
        # Same env materialization as reusable-netlify-deploy.yml: Vite bakes
        # import.meta.env.VITE_* from .env FILES, and all .env* are gitignored, so
        # write the client env into .env.production.local (highest precedence, never
        # uploaded — only dist/ is) before building. Key list = the reusable workflow's
        # list minus the Sentry keys (PR previews never report to Sentry or upload
        # sourcemaps); the sync is enforced by tests/ci/deploy-env-sync.policy.test.ts.
        env:
          VITE_API_BASE_URL: ${{ vars.PREVIEW_VITE_API_BASE_URL }}
          VITE_APP_ENV: development
          VITE_APP_VERSION: ${{ steps.version.outputs.vite_app_version }}
          VITE_CAPTCHA_DISABLED: ${{ vars.VITE_CAPTCHA_DISABLED }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.PREVIEW_VITE_TURNSTILE_SITE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.PREVIEW_VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.PREVIEW_VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.PREVIEW_VITE_POSTHOG_HOST }}
          VITE_PRIVACY_POLICY_URL: ${{ vars.PREVIEW_VITE_PRIVACY_POLICY_URL }}
          CSP_REPORT_URI: ${{ vars.PREVIEW_CSP_REPORT_URI }}
          VITE_DEBUG_LOGGING: ${{ vars.VITE_DEBUG_LOGGING }}
          VITE_DEVTOOLS: ${{ vars.VITE_DEVTOOLS }}
          VITE_E2E_HOOKS: ${{ vars.VITE_E2E_HOOKS }}
          VITE_VERSION_CHECK: ${{ vars.VITE_VERSION_CHECK }}
          VITE_PERSONAL_ORGANIZATIONS: ${{ vars.VITE_PERSONAL_ORGANIZATIONS }}
          VITE_TEAM_ORGANIZATIONS: ${{ vars.VITE_TEAM_ORGANIZATIONS }}
          VITE_DISABLED_MODULES: ${{ vars.VITE_DISABLED_MODULES }}
          STORED_FILES_ORIGIN: ${{ vars.STORED_FILES_ORIGIN }}
        run: |
          set -euo pipefail
          : > .env.production.local
          for key in VITE_API_BASE_URL VITE_APP_ENV VITE_APP_VERSION VITE_CAPTCHA_DISABLED \
            VITE_TURNSTILE_SITE_KEY VITE_STRIPE_PUBLISHABLE_KEY VITE_POSTHOG_KEY VITE_POSTHOG_HOST \
            VITE_PRIVACY_POLICY_URL CSP_REPORT_URI \
            VITE_DEBUG_LOGGING VITE_DEVTOOLS VITE_E2E_HOOKS VITE_VERSION_CHECK \
            VITE_PERSONAL_ORGANIZATIONS VITE_TEAM_ORGANIZATIONS VITE_DISABLED_MODULES \
            STORED_FILES_ORIGIN; do
            value="${!key}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$key" "$value" >> .env.production.local
            fi
          done
          echo "Materialized $(grep -c = .env.production.local) client env keys for the preview build."
          pnpm build

      - name: Upload the preview build
        if: env.HAS_PREVIEW_CONFIG == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  closed:
    name: Preview closed
    # preview-deploy.yml reads a finished run for a closed PR as "tear the preview down".
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Hand the teardown to preview-deploy.yml
        run: echo "Pull request closed; preview-deploy.yml removes its pr-<number> preview."
