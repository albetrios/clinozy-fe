# Enables squash auto-merge on a low-risk Dependabot PR (the `npm-non-major` group)
# once a maintainer APPROVES it — the approval is the manual gate. The PR then merges
# automatically when the required PR CI checks pass.
#
# A PR that changes a dependency file also runs the @smoke e2e against the backend
# image (e2e-backend.yml). That run is not a required check (it runs on dependency
# PRs alone, so requiring it would block every other PR), so auto-merge would not
# wait for it: this job waits for it first and arms nothing when it fails.
#
# Why approval-triggered (and not a required approval): main is solo-maintained with
# 0 required approvals (.github/rulesets/main.json) because an author can't approve
# their own PRs. A maintainer CAN approve Dependabot's PRs, so we use that approval
# as the opt-in signal to arm auto-merge — no branch-protection change needed.
# Majors / security / github-actions stay fully manual.
#
# Prerequisite: the repo setting "Allow auto-merge" must be enabled
# (Settings -> General -> Pull Requests -> Allow auto-merge).
#
# No third-party actions are used (keeps the action-pin gate satisfied); the
# non-major classification uses the Dependabot group name from .github/dependabot.yml.

name: Dependabot auto-merge

on:
  pull_request_review:
    types: [submitted]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ${{ vars.FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 || 'true' }}

jobs:
  enable-auto-merge:
    name: Enable auto-merge for approved low-risk Dependabot updates
    runs-on: ubuntu-latest
    # The e2e job alone may take 45 minutes; the wait below sits inside this budget.
    timeout-minutes: 60
    # RELEASE_PLEASE_TOKEN is an environment secret, so this job selects the
    # `development` environment to read it. That environment has an empty
    # protection block, so nothing is gated — which matters here because this
    # job runs on Dependabot PR branches: a `deploymentBranchPolicy` on
    # `development` would reject them outright and silently break auto-merge.
    environment: development
    # Maintainer approved + Dependabot-authored + the non-major npm group only.
    # `npm-major` does not contain the substring `npm-non-major`, so majors never match.
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      (
        contains(github.event.pull_request.title, 'npm-non-major') ||
        contains(github.event.pull_request.head.ref, 'npm-non-major')
      )
    steps:
      - name: Wait for the @smoke e2e on this head
        run: |
          set -euo pipefail
          # The list is read whole first: `grep -q` stopping early would hand `gh` a
          # SIGPIPE, and pipefail would then read a match as "no match".
          changed=$(gh pr diff "$PR_URL" --name-only)
          if ! grep -qxE 'package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml' <<<"$changed"; then
            echo "No dependency file changed, so no e2e runs on this PR: nothing to wait for."
            exit 0
          fi
          run_id=''
          for _ in $(seq 1 20); do
            run_id=$(gh run list --repo "$REPOSITORY" --workflow e2e-backend.yml --commit "$HEAD_SHA" \
              --event pull_request --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 15
          done
          if [ -z "$run_id" ]; then
            echo "::error::No 'E2E against the backend image' run for $HEAD_SHA after 5 minutes; auto-merge stays off."
            exit 1
          fi
          gh run watch "$run_id" --repo "$REPOSITORY" --exit-status --interval 30
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Enable squash auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # PAT (falling back to github.token) so the eventual merge is
          # PAT-attributed and its push to main TRIGGERS post-merge CI. A
          # GITHUB_TOKEN merge produces no post-merge run — no SBOM, no release,
          # no development-alias deploy for that commit. Same fix as the release PRs.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
