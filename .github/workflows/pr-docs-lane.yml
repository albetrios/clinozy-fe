name: Docs lane

# Lint and link-check markdown only when a PR touches markdown files.
# Separate workflow so code-only PRs do not show this lane as "Skipped".

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - '.markdownlint.json'
      - '.markdownlint-cli2.jsonc'
      - 'docs/**'

concurrency:
  group: pr-docs-lane-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ${{ vars.FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 || 'true' }}

jobs:
  markdown:
    name: Markdown lint + links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Collect changed markdown files
        id: changed-markdown
        run: |
          set -euo pipefail
          files="$(git diff --name-only --diff-filter=ACMRT \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- '*.md' || true)"
          # Generated changelogs are not link-checked (markdownlint already ignores them): a
          # release-please CHANGELOG.md holds thousands of commit/compare links into this private
          # repository, which lychee cannot open anonymously — it retried until the 15-minute
          # job timeout on every Release PR.
          files="$(printf '%s\n' "${files}" | grep -vE '(^|/)CHANGELOG[^/]*\.md$' || true)"
          if [ -z "${files}" ]; then
            echo "has-files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Single-quote each path: the lychee action's entrypoint shell-evaluates
          # its args, so an unquoted $param route folder (e.g.
          # src/pages/organization/$organizationSlug/…) dies with
          # "organizationSlug: unbound variable".
          files="$(printf '%s\n' "${files}" | sed "s/.*/'&'/")"
          {
            echo "has-files=true"
            echo "files<<EOF"
            echo "${files}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node and pnpm
        if: steps.changed-markdown.outputs.has-files == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Lint changed markdown (markdownlint-cli2 via pnpm docs:lint)
        if: steps.changed-markdown.outputs.has-files == 'true'
        run: pnpm docs:lint

      # Advisory (fail: false). Links into this organization's private repositories are skipped:
      # lychee checks anonymously, so they can never resolve and only cost retries.
      - name: Check links in changed markdown files (lychee)
        if: steps.changed-markdown.outputs.has-files == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --max-redirects 5
            --accept 200,204,206,429
            --timeout 20
            --max-retries 2
            --exclude '^https://github\.com/${{ github.repository_owner }}/'
            ${{ steps.changed-markdown.outputs.files }}
          fail: false
          failIfEmpty: false
