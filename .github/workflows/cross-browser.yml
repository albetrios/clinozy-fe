name: Cross-browser smoke

# Production-build smoke on Chromium, Firefox, and WebKit (Safari engine).
# Covers login shell, PWA manifest assets, version-update toast, and toast dismiss.
# Scheduled weekly; non-blocking for PRs (same posture as Lighthouse CI).

on:
  schedule:
    - cron: '0 4 * * 1' # Every Monday 04:00 UTC (after Lighthouse)
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ${{ vars.FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 || 'true' }}

jobs:
  cross-browser:
    name: Playwright cross-browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - run: pnpm build

      - run: pnpm test:cross-browser

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: cross-browser-failures
          path: test-results/cross-browser/
          retention-days: 14

  resolve-success:
    name: Close ci-failure issue
    needs: [cross-browser]
    if: always() && needs.cross-browser.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the open ci-failure issue
        uses: albetrios/clinozy-be/.github/actions/ci-failure-issue@1980ab5329f372b8e6cbf9764daaa7b5d4818447 # clinozy-be chore/agent-ci-all-waves — repin to its main once merged
        with:
          mode: close
          title: Weekly cross-browser smoke failing

  notify-failure:
    name: Notify failure
    needs: [cross-browser]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the fix plan reads the failed jobs and their logs
      contents: read
      issues: write
    steps:
      - name: Open or update ci-failure issue
        # A red scheduled run is invisible unless someone opens the Actions tab; one issue per
        # check sends a real notification, collects repeats as comments, and closes on the next
        # green run (clinozy-be's shared ci-failure-issue action).
        uses: albetrios/clinozy-be/.github/actions/ci-failure-issue@1980ab5329f372b8e6cbf9764daaa7b5d4818447 # clinozy-be chore/agent-ci-all-waves — repin to its main once merged
        with:
          mode: open
          title: Weekly cross-browser smoke failing
          body: |
            The weekly Chrome / Firefox / Safari smoke failed. The Playwright report is in the run's
            artifacts. The next green run closes this issue.
