<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Clinozy</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #fafafa;
        color: #333;
        text-align: center;
      }
      .container {
        max-width: 400px;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #666;
        margin-bottom: 1.5rem;
      }
      .retry {
        display: inline-block;
        background: #4f46e5;
        color: white;
        padding: 0.5rem 1.5rem;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        text-decoration: none;
        cursor: pointer;
      }
      .retry:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>You're offline</h1>
      <p>Please check your internet connection and try again.</p>
      <!-- Retry opens this same page again — a link, not an inline onclick: the
           CSP's script-src 'self' blocks inline handlers, and a link needs no
           script at all. -->
      <a class="retry" href="">Retry</a>
    </div>
  </body>
</html>
