<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline — Clinozy</title>
    <!-- The boot splash's offline hold (splash.md "States"), as a page of its own:
         the mark, the line and Retry on the canvas, in the launch's zinc tokens
         (preset.md). Static and script-free — the service worker serves it with
         no network — so the dark scheme follows the OS, and the fonts fall back
         to the system face when Inter is not installed. -->
    <style>
      :root {
        --canvas: #fafafa;
        --card: #ffffff;
        --text: #09090b;
        --text-strong: #52525b;
        --divider: #e4e4e7;
        --hover: #f4f4f5;
        --ink: #18181b;
        --on-ink: #fafafa;
        --mark-dot: #5bbd74;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0e0e10;
          --card: #141417;
          --text: #fafafa;
          --text-strong: #b4b4bc;
          --divider: #2c2c31;
          --hover: #1e1e22;
          --ink: #f4f4f5;
          --on-ink: #0e0e10;
          color-scheme: dark;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        box-sizing: border-box;
        background: var(--canvas);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-feature-settings: 'cv11', 'ss01';
        letter-spacing: -0.005em;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        max-width: 360px;
      }
      .mark {
        display: block;
        width: 64px;
        height: 64px;
      }
      .mark .tile {
        fill: var(--ink);
      }
      .mark .c {
        fill: none;
        stroke: var(--on-ink);
        stroke-width: 2.6;
        stroke-linecap: round;
      }
      .mark .dot {
        fill: var(--mark-dot);
      }
      .notice {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.45;
        color: var(--text-strong);
        text-wrap: pretty;
      }
      .retry {
        display: inline-flex;
        align-items: center;
        height: 36px;
        margin-top: 2px;
        padding: 0 14px;
        border: 1px solid var(--divider);
        border-radius: 8px;
        background: var(--card);
        color: var(--text);
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        transition: background-color 150ms ease;
      }
      .retry:hover {
        background: var(--hover);
      }
      .retry:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .retry {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 28 28" aria-hidden="true">
        <rect class="tile" width="28" height="28" rx="8" />
        <path class="c" d="M18.6 9.1a6.4 6.4 0 1 0 0 9.8" />
        <circle class="dot" cx="20.2" cy="14" r="2.3" />
      </svg>
      <div class="notice" role="alert">
        <h1>You’re offline</h1>
        <p>Can’t reach Clinozy · check the internet connection</p>
        <!-- Retry opens this same page again — a link, not an inline onclick: the
             CSP's script-src 'self' blocks inline handlers, and a link needs no
             script at all. -->
        <a class="retry" href="">Retry</a>
      </div>
    </main>
  </body>
</html>
